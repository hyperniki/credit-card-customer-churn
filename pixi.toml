[workspace]
authors = ["hyperniki <enyiefemvictory@gmail.com>"]
channels = ['conda-forge']
name = "credit-card-customer-churn"
platforms = ['win-64']
version = "0.1.0"

[tasks]
start-app = "streamlit run app.py"
train = "python train.py"

[dependencies]
python = "3.12.*"
pandas = ">=3.1.0,<4"
scikit-learn = ">=1.9.1,<2"
numpy = ">=2.5.4,<3"
seaborn = ">=0.13.2,<0.14"
xgboost = ">=3.4.2,<4"
ipykernel = "*"
joblib = ">=1.6.0,<2"
streamlit = ">=1.67.0,<2"
